name: Check Curvature Google connection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-google-connection.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch credential verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/check-google-connection.yml/dispatches" -f ref=main
  check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_JSON: ${{ secrets.GCP_SA_KEY || secrets.GOOGLE_CREDENTIALS || secrets.GCP_CREDENTIALS }}
    steps:
      - name: Verify configured credential types without displaying values
        env:
          CURVATURE_KEY: ${{ secrets.CURVATURE_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_JSON: ${{ secrets.GCP_SA_KEY || secrets.GOOGLE_CREDENTIALS || secrets.GCP_CREDENTIALS }}
        run: |
          node --input-type=module <<'NODE'
          for (const name of ['CURVATURE_KEY','SUPABASE_KEY','GOOGLE_JSON']) console.log(name + '_configured=' + Boolean(process.env[name]));
          NODE
      - uses: google-github-actions/auth@v3
        if: env.GOOGLE_JSON != ''
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GOOGLE_CREDENTIALS || secrets.GCP_CREDENTIALS }}
      - uses: google-github-actions/auth@v3
        if: env.GOOGLE_JSON == ''
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/curvature-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify access without deployment or secret disclosure
        run: |
          gcloud projects describe elegant-racer-299721 --format='value(projectId)'
          gcloud run services list --project=elegant-racer-299721 --region=us-central1 --filter='metadata.name=curvature-body-sculpting' --format='table(metadata.name,status.url,status.latestReadyRevisionName)'
          gcloud secrets list --project=elegant-racer-299721 --filter='name:curvature-supabase-service-role-key' --format='value(name)'
