name: Check Curvature Google connection
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: elegant-racer-299721
          workload_identity_provider: projects/484736877039/locations/global/workloadIdentityPools/elevate-github/providers/curvature-main
          service_account: elevate-github-deploy@elegant-racer-299721.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify access without deployment or secret disclosure
        run: |
          set -euo pipefail
          gcloud projects describe elegant-racer-299721 --format='value(projectId)'
          gcloud run services list --project=elegant-racer-299721 --region=us-central1 --filter='metadata.name=curvature-body-sculpting' --format='table(metadata.name,status.url,status.latestReadyRevisionName)'
          gcloud iam service-accounts list --project=elegant-racer-299721 --filter='email=curvature-runtime@elegant-racer-299721.iam.gserviceaccount.com' --format='value(email)'
          gcloud secrets list --project=elegant-racer-299721 --filter='name:curvature-supabase-service-role-key' --format='value(name)'
